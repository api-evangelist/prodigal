aid: prodigal
name: Prodigal
description: >-
  Prodigal is an AI company building purpose-built agents and intelligence for
  the loan-servicing and debt-collections industry. Its products include
  proAgent (end-to-end collections automation across voice and digital), PIE
  (an intelligence layer trained on more than half a billion consumer-finance
  interactions), proCollect (omnichannel digital orchestration), proScore
  (propensity-to-pay scoring from 500+ consumer attributes), proPay (an
  AI-native self-serve payment portal), proNotes (automated call notes),
  proInsight (QA automation, scorecards, and revenue analytics), and proAssist
  (real-time agent assistance). Prodigal serves auto finance, collections,
  healthcare revenue-cycle management, and lending, integrating with dialers
  and contact-center platforms such as Five9, Genesys, NICE, TCN, and
  DialConnect. It is backed by Accel and Menlo Ventures. Prodigal exposes no
  public developer API; this profile captures its identity, security posture,
  and compliance program.
